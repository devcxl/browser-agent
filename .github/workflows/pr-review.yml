# PR 自动审查（Pi Coding Agent）
#
# 触发方式：
#   1. pull_request：opened / synchronize / reopened / ready_for_review
#   2. workflow_dispatch：手动补审（可指定 PR 编号与门禁级别）
#
# 行为要点：
#   - 在 Runner 内用 git merge-base 本地比对，绕开 GitHub diff API 的 20000 行上限
#   - 审查 Agent 只拿到只读工具（read/grep/find/ls），工作区配置不被信任
#   - 结论以 <!-- pi-review:begin --> 标记幂等更新在 PR 上，不刷屏
#   - 默认只评论不拦截（fail_on: none）；需要硬门禁时用 workflow_dispatch 指定级别
#   - 拆成两个 job：解析 base SHA 的 job 只要只读权限，写权限只留给发布回评的 job
#
# 依赖的仓库级 Secrets（缺失时 Action 会优雅跳过，退出码 0）：
#   HALF_CABBAGE_BASE_URL / HALF_CABBAGE_API_KEY / TYPESAFE_API_KEY

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '要审查的 PR 编号'
        required: true
        type: string
      fail_on:
        description: '门禁级别（达到该级别即判定失败）'
        required: false
        default: 'none'
        type: choice
        options: [none, low, medium, high, critical]
      max_chunks:
        description: '本次最多审查的 chunk 数（0 = 不限）'
        required: false
        default: '0'
        type: string

concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# 工作流级默认权限：新增 job 默认只读，需要写的 job 必须显式声明
permissions:
  contents: read

jobs:
  # 解析 base SHA：
  #   - pull_request 事件：直接取事件载荷里的 base.sha
  #   - workflow_dispatch：事件载荷没有 PR 信息，用 gh pr view 解析
  # 该 job 只需只读权限，且始终运行（避免依赖“被跳过的 needs 仍会执行”这一隐式语义）。
  resolve-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Resolve base SHA
        id: base
        # 不在 PR 工作区里跑：避免带 token 的步骤与被审代码同处一个目录
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [[ ! "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::event payload carries no valid base SHA"
              exit 1
            fi
            echo "sha=$EVENT_BASE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a positive integer"
            exit 1
          fi
          # 独立赋值：gh 失败时 set -e 直接中止，保留 gh 自身的报错
          info="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName,baseRefOid --jq '.baseRefName + " " + .baseRefOid')"
          read -r base_ref sha <<< "$info"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || [[ -z "$base_ref" ]]; then
            echo "::error::failed to resolve base branch/baseRefOid"
            exit 1
          fi
          # base 分支可能在 checkout 之后前移；对象缺失时 Action 会用自己的
          # 带凭据 fetch 回退补拉，这里不重复 fetch（checkout 未落盘凭据）。
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  review:
    needs: [resolve-base]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      # merge-base 需要完整历史；不落盘凭据，避免审查 Agent 触达 git 凭证
      - name: Checkout PR head (full history, no persisted credentials)
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Run Pi PR Review
        # 固定到 v1.0.0 对应的 commit：工具白名单是本仓库的安全边界，不能被
        # 上游移动 tag 悄悄改写；后续版本由 Dependabot 提升该 SHA。
        uses: devcxl/agentic-action/pr-review@c36590a8ab4a8d4c8612de1f45c8f1cd6ed2b085 # v1.0.0
        with:
          provider: 'half-cabbage'
          model: 'minimax-m3'
          thinking: 'high'
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          base_sha: ${{ needs.resolve-base.outputs.base_sha }}
          max_chunks: ${{ inputs.max_chunks || '0' }}
          # 关联 Issue 决定审查侧重点与思考档位；未配置 TYPESAFE_API_KEY 时自动跳过
          link_issues: 'true'
          include_issue_body: 'false'
          triage_config: '.github/triage.yml'
          # 把仓库约定喂给审查 Agent，让结论对齐本项目的术语与决策记录
          context_files: 'AGENTS.md CONTEXT.md'
          # 工具白名单（与 Action 默认值一致，显式固定以防上游默认值漂移）。
          # 安全边界是这份白名单：Action 会把它作为 --tools 传给 Pi CLI，
          # 不含 bash/powershell 即无法执行命令；exclude_tools 是显式冗余保险
          # （同时拒绝 bash 与 powershell 时，Action 自身也判定 shell 关闭）。
          tools: 'read,grep,find,ls'
          exclude_tools: 'bash,powershell'
          # 排除构建产物与 vendored 第三方代码（后者由 security-audit 单独审计）
          exclude: '**/dist/**,**/coverage/**,**/.wxt/**,**/test-results/**,**/src/content/floating-widget/grokbot/**'
          fail_on: ${{ inputs.fail_on || 'none' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          typesafe_api_key: ${{ secrets.TYPESAFE_API_KEY }}
        env:
          HALF_CABBAGE_BASE_URL: ${{ secrets.HALF_CABBAGE_BASE_URL }}
          HALF_CABBAGE_API_KEY: ${{ secrets.HALF_CABBAGE_API_KEY }}
