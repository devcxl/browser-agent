name: CI (Lint + Test)

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # 类型检查独立成 job：lint 不覆盖类型错误，而发版工作流才会撞上，
  # 缺了这道门禁，类型问题会一直潜伏到打 tag 才暴露。
  # 覆盖面为 src 全量（含 entrypoints / content / __tests__）；vendored 的 grokbot 见 tsconfig 注释。
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # pretypecheck 跑 wxt prepare 生成 .wxt/types（gitignore，干净环境需重建）
      - run: npm run typecheck

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
      - run: npx vitest run --coverage

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # 扩展 e2e 使用 channel: 'chromium'（新 headless 模式支持 --load-extension；
      # headless shell 不支持），需完整 Chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run build:chrome
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  action-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned agentic-action still declares the inputs we rely on
        run: |
          set -euo pipefail
          ref="$(grep -oE 'devcxl/agentic-action/pr-review@[0-9a-f]{40}' .github/workflows/pr-review.yml | head -1 | cut -d@ -f2 || true)"
          if [ -z "$ref" ]; then
            echo "::error::未找到固定到 commit SHA 的 agentic-action 引用"
            exit 1
          fi
          echo "pinned ref: $ref"
          base="https://raw.githubusercontent.com/devcxl/agentic-action/$ref"
          # 拉取失败分两类：HTTP 错误（含 404，上游删了文件）= 契约破坏，硬失败；
          # 网络故障 = 告警跳过。护栏是漂移检测器，不是网络探测器。
          # 注意：不能用 `if ! curl; then code=$?`，`!` 会把退出码取反成 0。
          code=0
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 "$base/pr-review/action.yml" -o /tmp/pr-review-action.yml || code=$?
          if [ "$code" -eq 22 ]; then
            echo "::error::上游 $ref 已不提供 pr-review/action.yml，契约校验失败"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::网络原因无法拉取上游 action.yml，本次跳过契约校验"
            exit 0
          fi
          for input in base_sha tools exclude_tools; do
            if ! grep -qE "^  ${input}:" /tmp/pr-review-action.yml; then
              echo "::error::固定的 action 不再声明 input '$input'，需重新核对 docs/agents/pr-review.md 的 Tool isolation 一节"
              exit 1
            fi
          done
          # 取 tools 输入自己的 default 行（只在该输入块内取，避免抓到下一个输入的 default）
          if ! grep -qE '^  tools:' /tmp/pr-review-action.yml; then
            echo "::error::上游 action.yml 的结构已变（找不到 tools 输入），契约校验失败"
            exit 1
          fi
          # 取 tools 输入块内的 default 行：先按块切分（sed 区间），再在块内取唯一一行 default
          block="$(sed -n '/^  tools:/,/^  [a-z_][a-z_]*:/p' /tmp/pr-review-action.yml)"
          default_lines="$(printf '%s\n' "$block" | grep -cE '^[[:space:]]+default:' || true)"
          if [ "$default_lines" != "1" ]; then
            echo "::error::无法唯一定位 action 的 tools 默认值（找到 $default_lines 行），契约校验失败"
            exit 1
          fi
          default_tools="$(printf '%s\n' "$block" | grep -E '^[[:space:]]+default:' | head -1 | sed -E 's/^[[:space:]]*default:[[:space:]]*//' | tr -d "'\"")"
          if [ -z "$default_tools" ]; then
            echo "::error::无法解析 action 的默认工具集，契约校验失败"
            exit 1
          fi
          echo "action default tools: $default_tools"
          # 去空白后再匹配，避免 "read, bash" 这类带空白的绕过
          if echo "$default_tools" | tr -d '[:space:]' | grep -qE '(^|,)(bash|powershell)(,|$)'; then
            echo "::error::action 默认工具集包含可执行工具，白名单失效时将开放命令执行"
            exit 1
          fi

      - name: Verify our own tool allowlist stays read-only
        run: |
          set -euo pipefail
          # 本仓库实际生效的白名单才是安全边界：它不能包含可执行工具。
          # 只认 with 块里的 tools:（exclude_tools 是另一个键），并要求唯一匹配。
          matches="$(grep -cE '^[[:space:]]+tools:[[:space:]]*' .github/workflows/pr-review.yml || true)"
          if [ "$matches" != "1" ]; then
            echo "::error::期望恰好一处 tools: 白名单声明，实际 $matches 处"
            exit 1
          fi
          our_tools="$(grep -E '^[[:space:]]+tools:[[:space:]]*' .github/workflows/pr-review.yml | head -1 | sed -E 's/^[[:space:]]*tools:[[:space:]]*//' | tr -d "'\"")"
          if [ -z "$our_tools" ]; then
            echo "::error::无法解析 pr-review.yml 中传入的 tools 白名单"
            exit 1
          fi
          echo "workflow tools allowlist: $our_tools"
          if echo "$our_tools" | tr -d '[:space:]' | grep -qE '(^|,)(bash|powershell|sh|shell|exec)(,|$)'; then
            echo "::error::传入的 tools 白名单包含可执行工具，审查 Agent 将获得命令执行能力"
            exit 1
          fi

      - name: Verify pinned agentic-action still keeps the safety semantics we rely on
        run: |
          set -euo pipefail
          ref="$(grep -oE 'devcxl/agentic-action/pr-review@[0-9a-f]{40}' .github/workflows/pr-review.yml | head -1 | cut -d@ -f2)"
          base="https://raw.githubusercontent.com/devcxl/agentic-action/$ref"
          # 每个文件单独捕获退出码：任何一个 HTTP 错误（22）都算契约破坏
          code_policy=0
          code_bundle=0
          code_git=0
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 "$base/packages/core/src/capability/policy.ts" -o /tmp/policy.ts || code_policy=$?
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 "$base/dist/review-pr.js" -o /tmp/review-pr.js || code_bundle=$?
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 60 "$base/packages/adapters/src/git.ts" -o /tmp/git.ts || code_git=$?
          for code in "$code_policy" "$code_bundle" "$code_git"; do
            if [ "$code" -eq 22 ]; then
              echo "::error::上游 $ref 的实现文件已缺失，契约校验失败"
              exit 1
            fi
          done
          if [ "$code_policy" -ne 0 ] || [ "$code_bundle" -ne 0 ] || [ "$code_git" -ne 0 ]; then
            echo "::warning::网络原因无法拉取上游源码，本次跳过安全语义校验"
            exit 0
          fi
          # 断言 Action 仍然（1）恒定关闭 MCP 与项目配置信任、（2）不把 INPUT_* 与
          # GitHub token 透传给 Agent 子进程、（3）用 shell 判定控制 token 注入。
          # 源码与实际执行的 bundle 各断言一遍：源码是上游维护的文件，bundle 是真正跑的产物
          for guard in '"--no-mcp"' '"--no-approve"' 'startsWith("INPUT_")' 'key === "GITHUB_TOKEN" || key === "GH_TOKEN") continue' 'isShellEnabledInPolicy'; do
            if ! grep -qF -- "$guard" /tmp/policy.ts; then
              echo "::error::固定的 action 源码不再包含安全护栏 '$guard'，需重新核对 docs/agents/pr-review.md 的 Tool isolation 一节"
              exit 1
            fi
            if ! grep -qF -- "$guard" /tmp/review-pr.js; then
              echo "::error::固定的 action 产物不再包含安全护栏 '$guard'，需重新核对 docs/agents/pr-review.md 的 Tool isolation 一节"
              exit 1
            fi
          done
          # base SHA 缺失时由 Action 自己带凭据 fetch 补拉：这条兜底路径也必须还在
          for guard in 'rev-parse' '--no-tags' 'fetch'; do
            if ! grep -qF -- "$guard" /tmp/git.ts; then
              echo "::error::固定的 action 不再包含 base SHA 兜底 fetch 路径（'$guard'），需重新核对 docs/agents/pr-review.md 的 Base SHA resolution 一节"
              exit 1
            fi
          done
          echo "safety semantics verified"

  ci:
    needs: [lint, typecheck, test, action-contract]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TYPE_CHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTRACT_RESULT: ${{ needs.action-contract.result }}
        run: |
          test "$LINT_RESULT" = success && \
          test "$TYPE_CHECK_RESULT" = success && \
          test "$TEST_RESULT" = success && \
          test "$CONTRACT_RESULT" = success
