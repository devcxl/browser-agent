name: CI (Lint + Test)

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run
      - run: npx vitest run --coverage

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # 扩展 e2e 使用 channel: 'chromium'（新 headless 模式支持 --load-extension；
      # headless shell 不支持），需完整 Chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run build:chrome
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  action-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify pinned agentic-action still declares the inputs we rely on
        run: |
          set -euo pipefail
          ref="$(grep -oE 'devcxl/agentic-action/pr-review@[0-9a-f]{40}' .github/workflows/pr-review.yml | head -1 | cut -d@ -f2)"
          if [ -z "$ref" ]; then
            echo "::error::未找到固定到 commit SHA 的 agentic-action 引用"
            exit 1
          fi
          echo "pinned ref: $ref"
          base="https://raw.githubusercontent.com/devcxl/agentic-action/$ref"
          curl -fsSL "$base/pr-review/action.yml" -o /tmp/pr-review-action.yml
          for input in base_sha tools exclude_tools; do
            if ! grep -qE "^  ${input}:" /tmp/pr-review-action.yml; then
              echo "::error::固定的 action 不再声明 input '$input'，需重新核对 docs/agents/pr-review.md 的 Tool isolation 一节"
              exit 1
            fi
          done
          # 取 tools 输入自己的 default 行（只在该输入块内取，避免抓到下一个输入的 default）
          default_tools="$(awk '/^  tools:/{inblock=1; next} inblock && /^    default:/{sub(/^    default:[[:space:]]*/, ""); gsub(/["'\'']/, ""); print; exit} inblock && /^  [a-z_]+:/{exit}' /tmp/pr-review-action.yml || true)"
          if [ -z "$default_tools" ]; then
            echo "::error::无法解析 action 的默认工具集，契约校验失败"
            exit 1
          fi
          echo "action default tools: $default_tools"
          if echo "$default_tools" | grep -qE '(^|,)(bash|powershell)(,|$)'; then
            echo "::error::action 默认工具集包含可执行工具，白名单失效时将开放命令执行"
            exit 1
          fi

      - name: Verify our own tool allowlist stays read-only
        run: |
          set -euo pipefail
          # 本仓库实际生效的白名单才是安全边界：它不能包含可执行工具
          our_tools="$(awk '/^          tools:/{gsub(/["'\'']/, ""); sub(/^          tools:[[:space:]]*/, ""); print; exit}' .github/workflows/pr-review.yml || true)"
          if [ -z "$our_tools" ]; then
            echo "::error::无法解析 pr-review.yml 中传入的 tools 白名单"
            exit 1
          fi
          echo "workflow tools allowlist: $our_tools"
          if echo "$our_tools" | grep -qE '(^|,)(bash|powershell|sh|shell)(,|$)'; then
            echo "::error::传入的 tools 白名单包含可执行工具，审查 Agent 将获得命令执行能力"
            exit 1
          fi

      - name: Verify pinned agentic-action still keeps the safety semantics we rely on
        run: |
          set -euo pipefail
          ref="$(grep -oE 'devcxl/agentic-action/pr-review@[0-9a-f]{40}' .github/workflows/pr-review.yml | head -1 | cut -d@ -f2)"
          curl -fsSL "https://raw.githubusercontent.com/devcxl/agentic-action/$ref/packages/core/src/capability/policy.ts" -o /tmp/policy.ts
          # 断言 Action 仍然（1）恒定关闭 MCP 与项目配置信任、（2）不把 INPUT_* 与
          # GitHub token 透传给 Agent 子进程、（3）用 shell 判定控制 token 注入
          for guard in '"--no-mcp"' '"--no-approve"' 'startsWith("INPUT_")' 'key === "GITHUB_TOKEN" || key === "GH_TOKEN") continue' 'isShellEnabledInPolicy'; do
            if ! grep -qF -- "$guard" /tmp/policy.ts; then
              echo "::error::固定的 action 不再包含安全护栏 '$guard'，需重新核对 docs/agents/pr-review.md 的 Tool isolation 一节"
              exit 1
            fi
          done
          echo "safety semantics verified"

  ci:
    needs: [lint, test, action-contract]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CONTRACT_RESULT: ${{ needs.action-contract.result }}
        run: |
          test "$LINT_RESULT" = success && test "$TEST_RESULT" = success && test "$CONTRACT_RESULT" = success
